name: CISIA TOLC Seat Checker
on:
  schedule:
    # Runs at :25, :30, :55, :00 UTC (runs active checks across the schedule)
    - cron: '25,30,55,0 5-21 * * *'
  workflow_dispatch:

jobs:
  check-seats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tracker Check Cycle
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'cisia_tolc_alerts' }}
        run: |
          python tracker.py --once
